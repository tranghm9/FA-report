<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbc9db">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Sổ nợ Trang &amp; Dũng</title>
  <script>try{var t=JSON.parse(localStorage.getItem('sono.theme'));if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;document.documentElement.dataset.sonoTheme='1';document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#1f1419':'#fbc9db'}}catch(e){}</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="row"><h1>Sổ nợ Trang &amp; Dũng</h1><span class="btns"><a class="ibtn" href="#caidat" aria-label="Cài đặt">⚙</a><button type="button" id="refresh" aria-label="Tải lại dữ liệu">↻</button></span></div>
    <p id="meta" class="meta"></p>
    <div id="people" class="seg" role="group" aria-label="Lọc theo người"></div>
  </header>
  <main>
    <div id="warnings"></div>
    <div id="view"></div>
  </main>
  <nav id="nav" class="nav" aria-label="Màn hình"></nav>

  <script src="vendor/chart.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
