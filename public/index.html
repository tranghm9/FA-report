<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbc9db">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sổ nợ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Sổ nợ Trang &amp; Dũng</title>
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="lock" class="lock" hidden role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <div class="lock-box">
      <h1 id="lockTitle">Nhập mã PIN</h1>
      <p class="sub">Sổ nợ Trang &amp; Dũng đang khóa.</p>
      <label for="pin" class="sr">Mã PIN</label>
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12" placeholder="Mã PIN">
      <button type="button" id="pinOk">Mở khóa</button>
      <p id="pinMsg" class="note" role="status"></p>
      <button type="button" id="pinForgot" class="lnkbtn">Quên mã PIN</button>
    </div>
  </div>
  <header class="top">
    <div class="row"><h1>Sổ nợ Trang &amp; Dũng</h1><span class="btns"><a class="ibtn" href="#caidat" aria-label="Cài đặt">⚙</a><button type="button" id="refresh" aria-label="Tải lại dữ liệu">↻</button></span></div>
    <p id="meta" class="meta"></p>
    <div id="people" class="seg" role="group" aria-label="Lọc theo người"></div>
  </header>
  <main>
    <div id="warnings"></div>
    <div id="view"></div>
  </main>
  <nav id="nav" class="nav" aria-label="Màn hình"></nav>
  <script src="config.js"></script>
  <script src="vendor/chart.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
